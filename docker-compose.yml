# =============================================================================
# docker-compose.yml  —  Production stack (Postgres + backend + frontend)
#
# Host-agnostic and secret-free: every host-specific or secret value comes from
# the gitignored root `.env` (copy `.env.example`). Compose reads `.env` for
# ${VAR} interpolation and the backend also receives it via env_file.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose config        # check interpolation before starting
#   docker compose up -d --build
#
# Hosts, NAS layout and path rules: docs/architecture/STORAGE_AND_HOSTS.md
# Moving the stack between hosts:   docs/guides/MIGRATION_BEELINK_RUNBOOK.md
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: media-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-media_manager}
      POSTGRES_USER: ${POSTGRES_USER:-media_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only: the backend reaches Postgres over the compose network;
      # host-side tools (pg_dump, psql, MCP) connect via 127.0.0.1.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: media-manager-backend
    restart: unless-stopped
    labels:
      logging: "promtail"
      logging_project: "my-media-manager"
      logging_service: "backend"
    env_file:
      # Root .env carries the API keys (MEDIA_LIBRARY_*) and other backend settings.
      - path: ./.env
        required: true
      # Optional per-host overrides; not needed when everything is in the root .env.
      - path: ./backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Built from the same POSTGRES_* values as the postgres service, so the
      # password lives in one place. The entrypoint runs `alembic upgrade head`
      # with this URL (alembic/env.py swaps asyncpg for psycopg2).
      # POSTGRES_PASSWORD must be URL-safe (no @ : / ? # %), or percent-encode it.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-media_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-media_manager}
      JELLYFIN_DEST_BASE: ${JELLYFIN_DEST_BASE:-/ark/media/jellyfin}
      MEDIA_LIBRARY_INGRESS_DEFAULT_PATHS: ${MEDIA_LIBRARY_INGRESS_DEFAULT_PATHS:-["/ark/media/ingest"]}
      MEDIA_LIBRARY_INGRESS_AUTO_START_WATCHER: ${MEDIA_LIBRARY_INGRESS_AUTO_START_WATCHER:-true}
      MEDIA_LIBRARY_NAS_MOUNT_CHECK_PATH: ${MEDIA_LIBRARY_NAS_MOUNT_CHECK_PATH:-/ark/media}
      # Services that stay on ai-workstation, reached over the LAN.
      MEDIA_LIBRARY_DISC_RIPPER_URL: ${DISC_RIPPER_URL:?Set DISC_RIPPER_URL in .env (e.g. http://<ripper-host>:8083)}
      MEDIA_LIBRARY_LOCALAI_URL: ${LOCALAI_URL:?Set LOCALAI_URL in .env (e.g. http://<localai-host>:8080)}
      # One-time login seed for an empty auth table (ignored once a hash exists).
      APP_DEFAULT_PASSWORD: ${APP_DEFAULT_PASSWORD:-}
      # Set false to skip the entrypoint's `alembic upgrade head`.
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      HOST_ID: ${HOST_ID:-unknown}
      LOG_PROJECT: my-media-manager
      LOG_SERVICE: backend
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    ports:
      # LAN-reachable: the mobile app, disc-ripper-service and Prometheus call it directly.
      - "${BACKEND_PORT:-8082}:8082"
    volumes:
      # NAS media share. rslave lets the container follow (auto)remounts of the
      # host's CIFS mount instead of pinning a stale mount. The container path
      # must stay /ark/media: it is the path stored in the DB and shared with
      # disc-ripper-service.
      - type: bind
        source: ${MEDIA_ROOT:-/ark/media}
        target: /ark/media
        bind:
          propagation: rslave
          create_host_path: false
      - poster_cache:/data/media_manager/posters
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Migrations run before uvicorn starts.
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_OUTPUT: standalone
        NEXT_IGNORE_LINT: "true"
        NEXT_IGNORE_TYPE_ERRORS: "true"
        # Browser-side keys are baked into the client bundle at build time.
        NEXT_PUBLIC_OMDB_API_KEY: ${NEXT_PUBLIC_OMDB_API_KEY:-}
        NEXT_PUBLIC_TMDB_API_KEY: ${NEXT_PUBLIC_TMDB_API_KEY:-}
    container_name: media-manager-frontend
    restart: unless-stopped
    labels:
      logging: "promtail"
      logging_project: "my-media-manager"
      logging_service: "frontend"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://media-manager-backend:8082
      # Read at runtime by the /api/disc-ripper proxy (server-side only).
      DISC_RIPPER_URL: ${DISC_RIPPER_URL:?Set DISC_RIPPER_URL in .env}
      LOG_PROJECT: my-media-manager
      LOG_SERVICE: frontend
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "${FRONTEND_PORT:-3010}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  poster_cache:
